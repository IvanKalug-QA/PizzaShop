version: '3'

volumes:
  redis_data:
  rabbitmq_data:
  postgres_data:
  alembic:

services:
  postgres:
      image: postgres:13
      env_file: .env
      environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
      volumes:
      - postgres_data:/var/lib/postgresql/data
      ports:
        - "5432:5432"
  redis:
      image: redis:alpine
      restart: always
      volumes:
      - redis_data:/data
      ports:
      - "6379:6379"
  rabbitmq:
    image: rabbitmq:management
    env_file: .env
    restart: always
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
  backend:
    build: ./app
    env_file: .env
    environment:
      - PYTHONPATH=/
    restart: always
    volumes:
      - alembic:/app/alembic
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - rabbitmq
  